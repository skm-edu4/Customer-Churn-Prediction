[project]
name = "customer-churn-prediction"
version = "2.2.0"
description = "Production-grade customer churn prediction: sklearn + PyTorch, SHAP explainability, FastAPI service and Streamlit dashboard."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Sandeep Kumar Mahto", email = "skm.edu4@gmail.com" }]
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15.0",
    "scikit-learn>=1.4",
    "imbalanced-learn>=0.12",
    "xgboost>=2.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "torch>=2.2",
    "shap>=0.45",
    "mlflow>=2.15",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "streamlit>=1.36",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "joblib>=1.4",
    "typer>=0.12",
    "optuna>=5.0.0",
    "onnx>=1.23.2",
    "onnxruntime>=1.31.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "httpx>=0.27",
    "types-PyYAML",
    "pandas-stubs",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/churn"]

[tool.uv]
default-groups = ["dev"]

# torch resolves from the official CPU wheel index (not PyPI). PyPI's Linux
# torch wheel hard-requires the full CUDA runtime (nvidia-*, ≈ 3 GB of GPU
# wheels) at import time; the CPU index ships clean CPU-only wheels for every
# platform, which keeps `uv sync` lean locally, in CI, and in the Docker image.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
exclude = ["notebooks", "dashboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

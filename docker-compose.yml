# API + dashboard in containers.
#
#   docker compose up --build
#
#   API        → http://localhost:8000/docs
#   Dashboard  → http://localhost:8501
#
# The image bakes trained artefacts in at build time (so it also runs
# standalone as a single container on :7860 — that's the deployed mode on
# Hugging Face Spaces). For local iteration the host's `models/` and
# `reports/` are bind-mounted read-only over the baked copies: retrain with
# `make train` and restart, no rebuild needed. Run `make pipeline` once
# before the first `docker compose up` so the bind mounts aren't empty.
services:
  api:
    build: .
    image: customer-churn:latest
    container_name: churn-api
    command:
      [
        "/app/.venv/bin/uvicorn",
        "churn.serving.api:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
      ]
    ports:
      - "8000:8000"
    environment:
      CHURN_MODELS_DIR: /app/models
    volumes:
      - ./models:/app/models:ro
    healthcheck:
      test:
        [
          "CMD",
          "/app/.venv/bin/python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  dashboard:
    build: .
    image: customer-churn:latest
    container_name: churn-dashboard
    command:
      [
        "/app/.venv/bin/streamlit",
        "run",
        "dashboard/app.py",
        "--server.address",
        "0.0.0.0",
        "--server.port",
        "8501",
        "--browser.gatherUsageStats",
        "false",
      ]
    ports:
      - "8501:8501"
    environment:
      CHURN_API_URL: http://api:8000
    volumes:
      - ./models:/app/models:ro
      - ./reports:/app/reports:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "/app/.venv/bin/python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=4)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

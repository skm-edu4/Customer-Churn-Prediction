seed: 42
device: auto          # auto | cpu | cuda | mps

data:
  source: synthetic   # synthetic | telco
  n_customers: 5000
  telco_csv: data/raw/telco_customer_churn.csv
  test_size: 0.20
  split_strategy: random      # random | temporal (train on older cohorts, test on newer)
  temporal_drift: 0.0         # log-odds drift across observation months (0 = original data)

training:
  cv_folds: 5
  smote: true
  torch:
    hidden_dims: [64, 32]
    dropout: 0.30
    lr: 0.001
    weight_decay: 0.0001
    batch_size: 64
    max_epochs: 60
    patience: 8
    loss: weighted_bce      # weighted_bce | focal
    focal_gamma: 2.0
  tabtransformer:
    embed_dim: 16
    n_heads: 4
    n_layers: 2
    mlp_hidden: 32
    dropout: 0.10
    lr: 0.0005
    weight_decay: 0.0001
    batch_size: 64
    max_epochs: 60
    patience: 8
  hpo:                      # Optuna search (or run `make hpo` / `train.py --hpo`)
    enabled: false
    families: [logistic_regression, xgboost, random_forest, gradient_boosting]
    n_trials: 20
    timeout_seconds: 600
    cv_folds: 3

paths:
  models: models
  reports: reports
  figures: reports/figures
  tracking: mlruns

evaluation:
  thresholds: [0.30, 0.40, 0.50, 0.60]
  calibration_bins: 10
  shap_max_samples: 500
  costs:                     # decision economics for the threshold analysis
    false_positive: 1.0      # wasted retention offer
    false_negative: 5.0      # lost customer (typically worth far more)

benchmark:                   # scripts/benchmark.py (ONNX export + latency)
  warmup: 10
  n_iter: 200
  batch_sizes: [1, 64]
